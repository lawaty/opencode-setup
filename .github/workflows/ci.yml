# LaCode CI.
#
# Two jobs, both fully offline after the install step. There is deliberately no
# job that runs the benchmark against a live model: the harness needs credentials
# nobody should hand to CI, and it exits 0 with a "skipped" line without them.
# The benchmark is a maintainer tool, not a gate.
#
# The suite must not touch the network. If a test ever does, it fails here before
# it fails slowly on a laptop.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json engines requires >= 22.18: that is where node's TypeScript
        # type stripping is on by default, which every .ts import in src/ relies
        # on. The upper entry is the current LTS.
        node: ["22.18", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify the toolchain can load the TypeScript sources
        # A node too old to strip types fails deep inside a test with an opaque
        # error; this turns that into one readable line at the start.
        run: |
          node -e '
            if (!process.features.typescript) {
              console.error("node " + process.version + " cannot load .ts sources; node >= 22.18 is required");
              process.exit(1);
            }
            console.log("type stripping available on " + process.version);
          '

      - name: Test
        run: npm test

  pack:
    name: publish contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm

      - name: Install
        run: npm ci

      - name: Assert the published file list excludes tests, the runbook, and secrets
        # `files` in package.json is the only thing standing between the repo and
        # a published tarball, so it is checked mechanically instead of trusted.
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = JSON.parse(require("fs").readFileSync("pack.json", "utf8"))["@lawaty/lacode"].files.map((f) => f.path);
            const forbidden = (f) =>
              f.startsWith("tests/") ||
              f.startsWith(".github/") ||
              f === "OPERATIONS.md" ||
              /(^|\/)\.env/.test(f) ||
              f.startsWith("opencode.jsonc") ||
              f.startsWith("pool-models.json");
            const bad = files.filter(forbidden);
            if (bad.length > 0) {
              console.error("these files must never be published:\n  " + bad.join("\n  "));
              process.exit(1);
            }
            const required = ["package.json", "src/index.ts", "presets/free-tier.json", "bin/lacode"];
            const missing = required.filter((f) => !files.includes(f));
            if (missing.length > 0) {
              console.error("the package would be published without:\n  " + missing.join("\n  "));
              process.exit(1);
            }
            console.log(files.length + " files, none of them forbidden.");
          '

      - name: Clean up the manifest npm wrote
        if: always()
        run: rm -f pack.json